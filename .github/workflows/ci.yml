name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -count=1 -v ./...

      - name: Verify static cross-builds (CGO_ENABLED=0)
        run: |
          CGO_ENABLED=0 GOOS=linux  GOARCH=amd64 go build -trimpath -o /tmp/servecheck-linux-amd64 ./cmd/servecheck
          CGO_ENABLED=0 GOOS=linux  GOARCH=arm64 go build -trimpath -o /tmp/servecheck-linux-arm64 ./cmd/servecheck
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o /tmp/servecheck-darwin-arm64 ./cmd/servecheck
          /tmp/servecheck-linux-amd64 version
          /tmp/servecheck-linux-amd64 recipes --engine vllm > /dev/null
